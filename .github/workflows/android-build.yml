name: Android release build

on:
  push:
    branches:
      - myguide-main-integration
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-release:
    name: Build APK with R8 and core-library desugaring
    runs-on: ubuntu-latest
    env:
      MYGUIDE_KEYSTORE_BASE64: ${{ secrets.MYGUIDE_KEYSTORE_BASE64 }}
      MYGUIDE_STORE_PASSWORD: ${{ secrets.MYGUIDE_STORE_PASSWORD }}
      MYGUIDE_KEY_ALIAS: ${{ secrets.MYGUIDE_KEY_ALIAS }}
      MYGUIDE_KEY_PASSWORD: ${{ secrets.MYGUIDE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure optional production signing key
        if: ${{ env.MYGUIDE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ env.MYGUIDE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/myguide-release.keystore"
          echo "MYGUIDE_STORE_FILE=$RUNNER_TEMP/myguide-release.keystore" >> "$GITHUB_ENV"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Stage APK
        run: |
          mkdir -p release
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "release/My-Guide-1.1.0-release.apk"
          ls -lh release/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-guide-android-release-apk
          path: release/My-Guide-1.1.0-release.apk
          if-no-files-found: error
          retention-days: 30

# Android SDK setup uses the supported command-line tools package.
