name: Android release build

on:
  push:
    branches:
      - main
      - myguide-main-integration
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-build.yml'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-build.yml'
      - 'README.md'
      - 'MyGuideMobileApi/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-release:
    name: Build APK with R8 and core-library desugaring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Stage APK
        run: |
          mkdir -p release
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "release/My-Guide-1.1.1-release.apk"
          ls -lh release/

      - name: Add release APK to repository root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_NAME="My-Guide-1.1.1-release.apk"
          if [ ! -f "$APK_NAME" ]; then
            cp "release/$APK_NAME" "$APK_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$APK_NAME"
            git commit -m "Add My Guide 1.1.1 release APK [skip ci]"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          else
            echo "$APK_NAME already exists at repository root; leaving the committed release unchanged."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-guide-android-release-apk
          path: release/My-Guide-1.1.1-release.apk
          if-no-files-found: error
          retention-days: 30

# Android SDK setup uses the supported command-line tools package.
